name: Publicar

# Todo push na main vira uma versão nova, sem passo manual:
#   1. decide o número da versão (ver o passo "Decidir a versão");
#   2. roda os testes do app e do instalador;
#   3. gera o TranalSentinel.exe e o TranalSetup.exe com esse número gravado;
#   4. cria a tag vX.Y.Z e a release dela, com os executáveis para baixar.
# O auto-update (AutoUpdate.cs) procura a maior tag de versão entre as
# releases: sem a tag versionada, o app instalado nunca veria a atualização.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A versão do Directory.Build.props é o PISO. Se ela é maior que a
      # maior tag já publicada (alguém subiu a versão à mão: 0.36.0), ela é
      # usada como está. Senão, a release nova é a maior tag com o último
      # número somado de 1 (v0.36.0 -> v0.36.1). Assim nenhum push publica
      # uma versão repetida ou menor, e o auto-update sempre enxerga a nova.
      - name: Decidir a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $piso = [version]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)

          function Normalizar([version]$v) {
            [version]::new($v.Major, $v.Minor, [Math]::Max($v.Build, 0))
          }

          $tags = git ls-remote --tags origin |
            ForEach-Object { ($_ -split 'refs/tags/')[1] } |
            Where-Object { $_ -match '^v\d+\.\d+(\.\d+)?$' } |
            ForEach-Object { Normalizar ([version]$_.Substring(1)) }
          $maior = $tags | Sort-Object -Descending | Select-Object -First 1

          $piso = Normalizar $piso
          if (-not $maior -or $piso -gt $maior) { $nova = $piso }
          else { $nova = [version]::new($maior.Major, $maior.Minor, $maior.Build + 1) }

          "Piso (Directory.Build.props): $piso | maior tag: $maior | versão nova: $nova"
          "numero=$nova" >> $env:GITHUB_OUTPUT

      - name: Testes do app
        run: dotnet test TranalSentinel.Tests/TranalSentinel.Tests.csproj -c Release -nologo

      - name: Testes do instalador
        run: dotnet test Tranal.Setup.Tests/Tranal.Setup.Tests.csproj -c Release -nologo

      # A versão decidida entra pela linha de comando: ela vale por cima do
      # Directory.Build.props, e o executável sai com o número da release
      # (é com ele que o auto-update compara).
      - name: Publicar (arquivo único, com o .NET embutido)
        shell: pwsh
        run: |
          $v = "${{ steps.versao.outputs.numero }}"
          dotnet publish TranalSentinel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo `
            "-p:Version=$v" "-p:AssemblyVersion=$v.0" "-p:FileVersion=$v.0" "-p:InformationalVersion=$v"

      - name: Publicar o instalador
        shell: pwsh
        run: |
          $v = "${{ steps.versao.outputs.numero }}"
          dotnet publish Tranal.Setup/Tranal.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist-instalador -nologo `
            "-p:Version=$v" "-p:AssemblyVersion=$v.0" "-p:FileVersion=$v.0" "-p:InformationalVersion=$v"

      - name: Conferir a versão gravada no executável
        shell: pwsh
        run: |
          $esperada = "${{ steps.versao.outputs.numero }}.0"
          $gravada = (Get-Item dist/TranalSentinel.exe).VersionInfo.FileVersion
          if ($gravada -ne $esperada) { throw "O executável saiu com a versão $gravada, e a release é $esperada." }
          "TranalSentinel.exe $gravada"

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item Assets/PawnIO/COPYING dist/COPYING
          Copy-Item Assets/PawnIO/NOTICE.txt dist/NOTICE.txt
          Compress-Archive -Path dist/TranalSentinel.exe, dist/LEIA-ME.txt, dist/COPYING, dist/NOTICE.txt -DestinationPath TranalSentinel.zip

      # A release da versão é a "Latest" do GitHub: é a que aparece para
      # baixar na página do repositório. A tag é criada pelo próprio gh, no
      # commit deste push (a tag criada com o GITHUB_TOKEN não dispara outra
      # execução deste workflow).
      - name: Release da versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.versao.outputs.numero }}"
          gh release create $tag TranalSentinel.zip dist/TranalSentinel.exe dist-instalador/TranalSetup.exe `
            --target $env:GITHUB_SHA --latest --title "TRANAL SENTINEL $tag" --notes-file NOVIDADES.md

      # A release rolante "latest" continua existindo para quem guardou o link
      # dela; ela só não é mais a marcada como "Latest" no GitHub.
      - name: Atualizar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest TranalSentinel.zip dist/TranalSentinel.exe dist-instalador/TranalSetup.exe `
            --target $env:GITHUB_SHA --latest=false --title "TRANAL SENTINEL (versão mais recente)" --notes-file NOVIDADES.md
