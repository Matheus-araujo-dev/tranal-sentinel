name: Publicar

# Todo push na main vira uma versão nova, sem passo manual:
#   1. decide o número da versão (ver o passo "Decidir a versão");
#   2. roda os testes do app;
#   3. gera o TranalSentinel.exe com esse número gravado e compila o
#      instalador Inno Setup (installer/tranal-sentinel.iss) com o mesmo número;
#   4. cria a tag vX.Y.Z e a release dela, com o TranalSentinel-Setup.exe.
# Segue a DEC-APPS-DISTRIBUICAO-001. O auto-update (AutoUpdate.cs) procura a
# maior tag de versão entre as releases e baixa o TranalSentinel-Setup.exe dela:
# sem a tag versionada, o app instalado nunca veria a atualização.
#
# O botão "Run workflow" (aba Actions) publica na hora, escolhendo o salto:
# patch (0.36.1 -> 0.36.2), minor (-> 0.37.0) ou major (-> 1.0.0).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Que parte da versão sobe'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Só a main publica: o botão rodado em outra branch soltaria uma
      # release com código que não foi mesclado.
      - name: Conferir a branch
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "Publicar só roda na main (esta execução é de $env:GITHUB_REF)."

      # A versão nova parte da maior tag já publicada e sobe a parte pedida
      # (no push, sempre o patch). A versão do Directory.Build.props é um
      # PISO: se ela é maior que o resultado (alguém subiu à mão: 0.36.0),
      # vale ela. Assim nenhuma release sai com número repetido ou menor, e o
      # auto-update sempre enxerga a nova.
      - name: Decidir a versão
        id: versao
        shell: pwsh
        env:
          TIPO: ${{ inputs.tipo || 'patch' }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $piso = [version]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)

          function Normalizar([version]$v) {
            [version]::new($v.Major, $v.Minor, [Math]::Max($v.Build, 0))
          }

          $tags = git ls-remote --tags origin |
            ForEach-Object { ($_ -split 'refs/tags/')[1] } |
            Where-Object { $_ -match '^v\d+\.\d+(\.\d+)?$' } |
            ForEach-Object { Normalizar ([version]$_.Substring(1)) }
          $maior = $tags | Sort-Object -Descending | Select-Object -First 1
          if (-not $maior) { $maior = [version]::new(0, 0, 0) }

          $candidata = switch ($env:TIPO) {
            'major' { [version]::new($maior.Major + 1, 0, 0) }
            'minor' { [version]::new($maior.Major, $maior.Minor + 1, 0) }
            default { [version]::new($maior.Major, $maior.Minor, $maior.Build + 1) }
          }

          $piso = Normalizar $piso
          $nova = if ($piso -gt $candidata) { $piso } else { $candidata }

          "Tipo: $env:TIPO | maior tag: $maior | piso (Directory.Build.props): $piso | versão nova: $nova"
          "numero=$nova" >> $env:GITHUB_OUTPUT

      - name: Testes do app
        run: dotnet test TranalSentinel.Tests/TranalSentinel.Tests.csproj -c Release -nologo

      # A versão decidida entra pela linha de comando: ela vale por cima do
      # Directory.Build.props, e o executável sai com o número da release
      # (é com ele que o auto-update compara).
      - name: Publicar (arquivo único, com o .NET embutido)
        shell: pwsh
        run: |
          $v = "${{ steps.versao.outputs.numero }}"
          dotnet publish TranalSentinel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo `
            "-p:Version=$v" "-p:AssemblyVersion=$v.0" "-p:FileVersion=$v.0" "-p:InformationalVersion=$v"

      - name: Conferir a versão gravada no executável
        shell: pwsh
        run: |
          $esperada = "${{ steps.versao.outputs.numero }}.0"
          $gravada = (Get-Item dist/TranalSentinel.exe).VersionInfo.FileVersion
          if ($gravada -ne $esperada) { throw "O executável saiu com a versão $gravada, e a release é $esperada." }
          "TranalSentinel.exe $gravada"

      # O que vai dentro do instalador (e do .zip portátil): o app, o LEIA-ME,
      # a licença do projeto e a do PawnIO.
      - name: Montar a carga
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item LICENSE dist/LICENSE
          Copy-Item Assets/PawnIO/COPYING dist/COPYING
          Copy-Item Assets/PawnIO/NOTICE.txt dist/NOTICE.txt

      # O instalador do driver PawnIO vai dentro do TranalSentinel-Setup.exe:
      # sem ele, um PC novo fica sem temperatura e consumo da CPU. A versão é
      # fixada e o arquivo só entra se o hash bater e a assinatura for válida e
      # do autor (namazso). Para subir a versão: troque a tag e o hash juntos.
      - name: Baixar e conferir o instalador do PawnIO
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAWNIO_TAG: "2.2.0"
          PAWNIO_SHA256: "1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032"
        run: |
          gh release download $env:PAWNIO_TAG -R namazso/PawnIO.Setup -p PawnIO_setup.exe -D dist --clobber
          $hash = (Get-FileHash dist/PawnIO_setup.exe -Algorithm SHA256).Hash
          if ($hash -ne $env:PAWNIO_SHA256) { throw "O PawnIO_setup.exe $env:PAWNIO_TAG não bate com o hash fixado ($hash)." }
          $assinatura = Get-AuthenticodeSignature dist/PawnIO_setup.exe
          if ($assinatura.Status -ne 'Valid') { throw "A assinatura do PawnIO_setup.exe não é válida: $($assinatura.Status)" }
          if ($assinatura.SignerCertificate.Subject -notmatch 'O=namazso') { throw "O PawnIO_setup.exe não foi assinado pelo autor: $($assinatura.SignerCertificate.Subject)" }
          "PawnIO_setup.exe $env:PAWNIO_TAG conferido"

      # O Inno Setup costuma vir na imagem do runner; se não vier, é instalado
      # aqui (o runner é descartável, não a máquina de ninguém).
      - name: Compilar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $candidatos = { @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $candidatos
          if (-not $iscc) {
            Write-Host "Inno Setup não encontrado; instalando pelo chocolatey"
            choco install innosetup --no-progress --yes
            $iscc = & $candidatos
          }
          if (-not $iscc) { throw "Inno Setup não encontrado no runner" }
          Write-Host "ISCC: $iscc"

          $v = "${{ steps.versao.outputs.numero }}"
          & $iscc "/DMyAppVersion=$v" "/DPayloadDir=$PWD\dist" "/DOutputDir=$PWD\dist-setup" installer/tranal-sentinel.iss
          if ($LASTEXITCODE -ne 0) { throw "O iscc falhou (código $LASTEXITCODE)." }

          $gravada = (Get-Item dist-setup/TranalSentinel-Setup.exe).VersionInfo.ProductVersion.Trim()
          if ($gravada -ne $v) { throw "O instalador saiu com a versão $gravada, e a release é $v." }
          "TranalSentinel-Setup.exe $gravada"

      # O .zip é a versão portátil (sem instalar): o app e os textos que vão
      # junto. Quem quer instalar baixa só o TranalSentinel-Setup.exe.
      - name: Montar o .zip portátil
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TranalSentinel.exe, dist/LEIA-ME.txt, dist/LICENSE, dist/COPYING, dist/NOTICE.txt -DestinationPath TranalSentinel.zip

      # A release da versão é a "Latest" do GitHub: é a que aparece para
      # baixar na página do repositório. O TranalSentinel.exe portátil continua
      # na release: é o asset que o atualizador antigo (até a v0.36) procura, e
      # é por ele que quem tem a v0.36 chega à versão que roda o instalador. A tag é criada pelo próprio gh, no
      # commit deste push (a tag criada com o GITHUB_TOKEN não dispara outra
      # execução deste workflow).
      - name: Release da versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.versao.outputs.numero }}"
          gh release create $tag dist-setup/TranalSentinel-Setup.exe TranalSentinel.zip dist/TranalSentinel.exe `
            --target $env:GITHUB_SHA --latest --title "TRANAL SENTINEL $tag" --notes-file NOVIDADES.md

      # A release rolante "latest" continua existindo para quem guardou o link
      # dela; ela só não é mais a marcada como "Latest" no GitHub.
      - name: Atualizar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest dist-setup/TranalSentinel-Setup.exe TranalSentinel.zip dist/TranalSentinel.exe `
            --target $env:GITHUB_SHA --latest=false --title "TRANAL SENTINEL (versão mais recente)" --notes-file NOVIDADES.md
